name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    # A private copy pays for its Actions minutes, so it runs the checks only when
    # started by hand.
    if: &checks github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: (github.event_name == 'workflow_dispatch' || !github.event.repository.private) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    # macOS runners are often capacity-starved; keep Linux/Windows as the
    # hard compile signal so a queued cancel does not red the whole branch.
    continue-on-error: ${{ matrix.platform == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          packages=(
            ninja-build
            libgtk-3-dev
            libayatana-appindicator3-dev
            libsecret-1-dev
          )
          apt_opts=(
            -o Acquire::Retries=5
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          for attempt in 1 2 3 4 5; do
            if sudo apt-get "${apt_opts[@]}" update &&
              sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "apt install failed (attempt $attempt); retrying..." >&2
            sleep $((attempt * 15))
            sudo apt-get clean || true
          done
          exit 1

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the desktop runners and the native plugin code that only the
      # tagged release matrix built before; the bundle itself is discarded.
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  go:
    name: Go core
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    name: Android unit tests
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # No JVM unit test loads the Core or the Flutter build, but `:core` compiles against
          # the gomobile AAR, so one ABI of it is built.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    if: *checks
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    # Releases publish where the release links point: the public repository.
    if: github.repository == 'joei4cm/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform flake (esp. macOS arm64 runner capacity) must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          # macOS amd64 (Intel) and arm64 are built outside this matrix so a
          # capacity cancel on macos-15-intel cannot mark the whole build job
          # cancelled and skip upload (see build-macos-amd64* / build-macos-arm64*).
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      # proxy.golang.org occasionally returns HTTP/2 INTERNAL_ERROR mid-zip; warm the
      # module cache with retries so Setup does not fail the whole release matrix.
      - name: Prefetch Go modules
        shell: bash
        working-directory: core
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i); retrying..." >&2
            sleep $((i * 20))
          done
          exit 1

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          GOPROXY: https://proxy.golang.org,direct
          # The setup hook builds the Core for the host slice only, so an x86_64 slice in the arm64 app cannot run.
          FLUTTER_MACOS_ARM64_ONLY: ${{ matrix.platform == 'macos' && matrix.arch == 'arm64' }}
        # `dart run` first runs every build hook for this runner; the packager builds for the target itself.
        run: dart tool/package.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  # macOS Intel runners are also capacity-starved. Keep amd64 outside the main
  # matrix so a queued cancel cannot set needs.build.result to cancelled and
  # skip release upload. Retries must fire on cancelled — `if: failure()` does
  # not match cancelled. Late DMGs attach via attach-macos.
  build-macos-amd64:
    name: build (macos, amd64, ${{ matrix.runner }})
    if: github.repository == 'joei4cm/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Standard hosted Intel labels only (macos-*-large are billed larger runners).
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps: &macos-amd64-steps
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || \
            sudo xcode-select -s /Applications/Xcode_26.2.app || \
            sudo xcode-select -s /Applications/Xcode_16.4.app || \
            sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          uname -m

      - name: Require Intel host
        run: |
          arch="$(uname -m)"
          test "$arch" = 'x86_64' || {
            echo "Runner is $arch; need x86_64 for the Intel DMG" >&2
            exit 1
          }

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Prefetch Go modules
        shell: bash
        working-directory: core
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i); retrying..." >&2
            sleep $((i * 20))
          done
          exit 1

      - name: Setup
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: dart tool/package.dart macos ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-amd64-${{ matrix.runner }}-${{ github.job }}
          path: ./dist
          overwrite: true

  wait-macos-amd64-retry:
    name: wait before macOS amd64 retry
    needs: [build-macos-amd64]
    if: |
      always() &&
      !cancelled() &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.publish.outputs.needed }}
    steps:
      - name: Download any amd64 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: artifact-macos-amd64-*
          path: ./dist
          merge-multiple: true
      - name: Publish needed flag
        id: publish
        run: |
          if compgen -G './dist/*macos-amd64*' > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            sleep 600
          fi

  build-macos-amd64-retry:
    name: build (macos, amd64, retry, ${{ matrix.runner }})
    needs: [wait-macos-amd64-retry]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-amd64-retry.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps: *macos-amd64-steps

  wait-macos-amd64-retry-2:
    name: wait before macOS amd64 retry 2
    needs: [wait-macos-amd64-retry, build-macos-amd64-retry]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-amd64-retry.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.publish.outputs.needed }}
    steps:
      - name: Download any amd64 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: artifact-macos-amd64-*
          path: ./dist
          merge-multiple: true
      - name: Publish needed flag
        id: publish
        run: |
          if compgen -G './dist/*macos-amd64*' > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            sleep 900
          fi

  build-macos-amd64-retry-2:
    name: build (macos, amd64, retry 2, ${{ matrix.runner }})
    needs: [wait-macos-amd64-retry-2]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-amd64-retry-2.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps: *macos-amd64-steps

  # macOS arm64 runners are frequently capacity-starved (queued jobs cancel
  # with no runner). Build outside the main matrix; try several Apple Silicon
  # labels in parallel, then retry after longer backoffs. Retries must also
  # fire on cancelled — `if: failure()` does not match cancelled.
  # If a tag still ships without arm64, run workflow macos-arm64-attach.
  build-macos-arm64:
    name: build (macos, arm64, ${{ matrix.runner }})
    if: github.repository == 'joei4cm/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Capacity cancels must not fail the whole release; upload still publishes
    # the rest (Intel macOS DMG runs on Apple Silicon via Rosetta 2).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps: &macos-arm64-steps
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || \
            sudo xcode-select -s /Applications/Xcode_26.2.app || \
            sudo xcode-select -s /Applications/Xcode_16.4.app || \
            sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          uname -m

      - name: Require Apple Silicon host
        run: |
          arch="$(uname -m)"
          test "$arch" = 'arm64' || {
            echo "Runner is $arch; need arm64 for the Apple Silicon DMG" >&2
            exit 1
          }

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Prefetch Go modules
        shell: bash
        working-directory: core
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i); retrying..." >&2
            sleep $((i * 20))
          done
          exit 1

      - name: Setup
        env:
          GOPROXY: https://proxy.golang.org,direct
          # The setup hook builds the Core for the host slice only, so an x86_64 slice in the arm64 app cannot run.
          FLUTTER_MACOS_ARM64_ONLY: 'true'
        run: dart tool/package.dart macos ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-arm64-${{ matrix.runner }}-${{ github.job }}
          path: ./dist
          overwrite: true

  wait-macos-arm64-retry:
    name: wait before macOS arm64 retry
    needs: [build-macos-arm64]
    if: |
      always() &&
      !cancelled() &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.publish.outputs.needed }}
    steps:
      - name: Download any arm64 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: artifact-macos-arm64-*
          path: ./dist
          merge-multiple: true
      - name: Publish needed flag
        id: publish
        run: |
          if compgen -G './dist/*macos-arm64*' > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            sleep 600
          fi

  build-macos-arm64-retry:
    name: build (macos, arm64, retry, ${{ matrix.runner }})
    needs: [wait-macos-arm64-retry]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-arm64-retry.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps: *macos-arm64-steps

  wait-macos-arm64-retry-2:
    name: wait before macOS arm64 retry 2
    needs: [wait-macos-arm64-retry, build-macos-arm64-retry]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-arm64-retry.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.publish.outputs.needed }}
    steps:
      - name: Download any arm64 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: artifact-macos-arm64-*
          path: ./dist
          merge-multiple: true
      - name: Publish needed flag
        id: publish
        run: |
          if compgen -G './dist/*macos-arm64*' > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            sleep 900
          fi

  build-macos-arm64-retry-2:
    name: build (macos, arm64, retry 2, ${{ matrix.runner }})
    needs: [wait-macos-arm64-retry-2]
    if: |
      always() &&
      !cancelled() &&
      needs.wait-macos-arm64-retry-2.outputs.needed == 'true' &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps: *macos-arm64-steps

  upload:
    permissions:
      contents: write
    # Do not wait on macOS amd64/arm64 retries — those jobs attach later if they
    # win a runner. Blocking on them left releases stuck behind capacity cancels
    # (and a cancelled macos-15-intel matrix cell used to skip this job entirely).
    needs: [build, dart, plugins, go, android, rust, windows-helper-test]
    if: |
      always() &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.dart.result == 'success' &&
      needs.plugins.result == 'success' &&
      needs.go.result == 'success' &&
      needs.android.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.windows-helper-test.result == 'success'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$IS_STABLE" == 'true' ]]; then
            notes_tag=$(printf '%s' "$TAG" | sed -E 's/_[0-9a-fA-F]{6}$//')
            target=(--tag "$notes_tag")
          else
            dart run tool/changelog.dart build --unreleased
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md
          dart run tool/changelog.dart render telegram "${target[@]}" --out telegram.md

      - name: Patch release.md
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version=$(printf '%s' "$tag" | sed -E 's/^v//; s/_[0-9a-fA-F]{6}$//')
          sed -e "s|TAG|$tag|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          if ! compgen -G './dist/*macos-amd64*' > /dev/null; then
            {
              echo
              echo '> **macOS Intel:** the amd64 DMG was not ready when this release published (GitHub runner capacity). A follow-up upload may attach it to this tag; otherwise re-run the release or macos attach workflow later.'
            } >> release.md
          fi
          if ! compgen -G './dist/*macos-arm64*' > /dev/null; then
            {
              echo
              echo '> **macOS Apple Silicon:** the arm64 DMG was not ready when this release published (GitHub runner capacity). Use the Intel DMG under Rosetta 2, or grab an arm64 asset if a follow-up upload lands on this tag.'
            } >> release.md
          fi

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Dual-name assets so clients that still embed the tag commit suffix
          # (FlClash-0.9.19_abcdef-…) can verify against SHA256SUMS.
          bash .github/scripts/alias_tag_assets.sh "$TAG" ./dist
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'

      - name: Push to telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python release_telegram.py

  # Best-effort: attach Intel/arm64 macOS DMGs if a retry eventually gets a
  # runner. Also refreshes SHA256SUMS so in-app update verification accepts them.
  # If arm64 still misses, dispatch workflow macos-arm64-attach for the tag.
  attach-macos:
    name: attach macOS
    permissions:
      contents: write
    needs:
      [
        upload,
        build-macos-amd64,
        wait-macos-amd64-retry,
        build-macos-amd64-retry,
        wait-macos-amd64-retry-2,
        build-macos-amd64-retry-2,
        build-macos-arm64,
        wait-macos-arm64-retry,
        build-macos-arm64-retry,
        wait-macos-arm64-retry-2,
        build-macos-arm64-retry-2,
      ]
    if: |
      always() &&
      github.repository == 'joei4cm/FlClash' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS amd64
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./dist/
          pattern: artifact-macos-amd64-*
          merge-multiple: true

      - name: Download macOS arm64
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./dist/
          pattern: artifact-macos-arm64-*
          merge-multiple: true

      - name: Attach to release
        if: ${{ env.IS_STABLE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! compgen -G './dist/*macos-amd64*' > /dev/null && \
             ! compgen -G './dist/*macos-arm64*' > /dev/null; then
            echo 'No macOS artifacts; skipping attach (use macos-arm64-attach for arm64).'
            exit 0
          fi
          bash .github/scripts/alias_tag_assets.sh "$TAG" ./dist
          mapfile -t files < <(find ./dist -type f ! -name '.*' | sort)
          printf 'Attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

          mkdir -p /tmp/sums
          if gh release download "$TAG" -D /tmp/sums -p SHA256SUMS; then
            # Drop both bare and tag-suffixed macOS lines before re-adding.
            grep -vE 'macos-(amd64|arm64)' /tmp/sums/SHA256SUMS > /tmp/SHA256SUMS || true
          else
            : > /tmp/SHA256SUMS
          fi
          (
            cd ./dist
            sha256sum ./*
          ) >> /tmp/SHA256SUMS
          sort -k2 /tmp/SHA256SUMS -o /tmp/SHA256SUMS
          gh release upload "$TAG" /tmp/SHA256SUMS --clobber
